name: Tests

# Unit and protocol tests: fast, no external tools.

on:
  push:
    branches: [main]
    paths: &paths
      - lua/**
      - plugin/**
      - spec/**
      - .busted
      - lux.toml
      - lux.lock
      - .github/workflows/test.yml
  pull_request:
    paths: *paths
  schedule:
    # Neovim nightly changes every day
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    # Only Linux: the plugin has no system-specific code, and the tests run
    # locally on macOS
    runs-on: ubuntu-24.04
    # A run that hangs would otherwise take GitHub's default of 6 hours
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - uses: lumen-oss/gh-actions-lux@v1
        with:
          version: 0.47.0

      - name: Run tests
        # nlua runs its stdin as Lua after the tests when stdin isn't a terminal:
        # an empty one ends it, where one that's never closed would hang the run
        run: lx test < /dev/null
