name: Tests

# Unit and protocol tests: fast, no external tools.

on:
  push:
    branches: [main]
    paths: &paths
      - lua/**
      - spec/**
      - .busted
      - lux.toml
      - lux.lock
      - .github/workflows/test.yml
  pull_request:
    paths: *paths
  schedule:
    # Neovim nightly changes every day
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - uses: lumen-oss/gh-actions-lux@v1
        with:
          version: 0.47.0

      - name: Run tests
        run: lx test
