name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.suite }} tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        # default: unit and protocol tests; e2e: oracle and end-to-end tests
        suite: [default, e2e]
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - uses: lumen-oss/gh-actions-lux@v1
        with:
          version: 0.47.0

      - uses: astral-sh/setup-uv@v10
        if: matrix.suite == 'e2e'

      - name: Run tests
        run: lx test -- --run=${{ matrix.suite }}

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua spec
